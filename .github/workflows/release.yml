# Push a v* tag to publish a release. Draft the release by hand first to
# write its notes; otherwise GitHub generates them. The Homebrew tap
# (krank56/homebrew-tap) picks the new release up on its own within the hour.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make dist stamps the version from git describe

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make vet test

      - run: make dist VERSION=${{ github.ref_name }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --title "$TAG" --generate-notes
          fi
